<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420">
  <rect width="640" height="420" fill="#e9e9e6"/>
  <rect x="20" y="20" width="600" height="380" fill="#ffffff" stroke="#222" stroke-width="3"/>
  <!-- speech bubble with vertical Japanese text (two columns, read right to left) -->
  <path d="M 320 40 Q 470 40 470 190 Q 470 300 320 300 Q 200 300 180 220 L 150 260 L 175 200 Q 170 40 320 40 Z" fill="#ffffff" stroke="#111" stroke-width="3"/>
  <g font-family="'Yu Mincho','Yu Gothic','MS Mincho',serif" font-size="30" font-weight="bold" fill="#111" text-anchor="middle">
    <!-- right column: これは -->
    <text x="385" y="100">こ<tspan x="385" dy="31">れ</tspan><tspan x="385" dy="31">は</tspan></text>
    <!-- left column: ペンです -->
    <text x="325" y="100">ペ<tspan x="325" dy="31">ン</tspan><tspan x="325" dy="31">で</tspan><tspan x="325" dy="31">す</tspan></text>
  </g>
  <!-- bottom caption, horizontal Japanese -->
  <rect x="60" y="330" width="380" height="50" fill="#ffffff" stroke="#111" stroke-width="3"/>
  <text x="250" y="364" font-family="'Yu Gothic','Meiryo',sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#111">明日もまた戦うだろう</text>
</svg>
